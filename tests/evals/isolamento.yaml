# Isolamento entre empresas (US3, SC-002): 30 perguntas por empresa, cada uma respondida só com a base própria.
#
# Cada empresa tem uma pasta de documentos em tests/evals/ e:
#   - `perguntas`: a pergunta e o `esperado` (trechos que precisam aparecer na resposta, sem acento e em
#     minúsculas, todos exigidos);
#   - `marcadores`: expressões (sem acento, minúsculas) que existem SÓ nos documentos da empresa. Se aparecerem na
#     resposta de OUTRA empresa, houve vazamento.
empresas:
