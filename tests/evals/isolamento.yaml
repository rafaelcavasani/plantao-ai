    nome: Clínica Sorriso
    docs: docs_piloto
    topicos_proibidos: ["garantia de resultado"]
    marcadores: ["clinica sorriso", "acacias", "odonto vida", "sorriso saude"]
    perguntas:
      - {pergunta: "Que horas vocês abrem no sábado?", esperado: ["12"]}
