      - {pergunta: "Tem desconto para pagamento à vista?", esperado: ["10%"]}
      - {pergunta: "Posso cancelar uma consulta sem pagar nada?", esperado: ["24"]}
      - {pergunta: "Qual a multa se eu cancelar de última hora?", esperado: ["50%"]}
      - {pergunta: "Qual a tolerância de atraso?", esperado: ["15"]}
