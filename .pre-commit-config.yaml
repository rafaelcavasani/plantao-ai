# Instalar a partir da raiz do repositório git:
#   pre-commit install -c plantao-ai/.pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^plantao-ai/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy (core, agents, db)
        entry: bash -c 'cd plantao-ai && python -m mypy'
        language: system
        pass_filenames: false
        files: ^plantao-ai/(core|agents|db)/
