    hash: "$2y$10$eGQATIjByEf/lkS.7OceRuJrM.slNLbOY8JLJNqRSKcqyZ.tOi/22"
    username: operador
    userID: 3f7a1c2e-0b1d-4c53-9a10-0a5e6f7b8c01
