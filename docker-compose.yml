services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantao
      POSTGRES_PASSWORD: plantao
      POSTGRES_DB: plantao
    ports:
      - "5432:5432"
    volumes:
      - plantao_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  plantao_pg_data:
